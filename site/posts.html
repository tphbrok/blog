<html>
  <head>
    <title>Posts - tphbrok.me</title>
    <style>
      :root {
        color-scheme: light dark;
        --color-primary: rgb(194, 104, 1);
        --color-black: rgb(39, 39, 35);
        --color-white: rgb(240, 240, 225);
      }

      @media (prefers-color-scheme: light) {
        body {
          background-color: var(--color-white);
          color: var(--color-black);
        }

        #metadata > span {
          background-color: rgb(from var(--color-black) r g b / 10%);
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: var(--color-black);
          color: var(--color-white);
        }

        #metadata > span {
          background-color: rgb(from var(--color-white) r g b / 10%);
        }
      }

      a {
        color: var(--color-primary);
      }

      a.header {
        color: unset;
      }

      body {
        font-family:
          ui-sans-serif,
          system-ui,
          sans-serif,
          "Apple Color Emoji",
          "Segoe UI Emoji",
          Segoe UI Symbol,
          "Noto Color Emoji";

        max-width: 960px;
        padding: 0 16px;
        margin: 0 auto;
        font-size: 16px;
      }

      body > * {
        margin: 16px 0;
        padding-bottom: 16px;
      }

      header {
        display: flex;
        justify-content: space-between;
      }

      header > span {
        padding-bottom: 0;
        font-weight: bold;
      }

      article p,
      article h2 {
        margin-bottom: 32px;
      }

      .posts-year {
        margin-top: 32px;
      }

      p {
        line-height: 28px;
      }

      h1 {
        font-size: 36px;
        letter-spacing: -1px;
      }

      h2 {
        font-size: 20px;
      }

      .categories {
        list-style: none;
        display: inline-flex;
        column-gap: 4px;
        padding-left: 0;
        align-items: center;
        margin: 0px;
        flex-wrap: wrap;
        height: fit-content;
        row-gap: 4px;
        width: fit-content;
      }

      #metadata {
        font-size: 14px;
        margin-bottom: 32px;
        display: flex;
        align-items: center;
        column-gap: 8px;
        flex-wrap: wrap;
        /* height: fit-content; */
        padding-top: 16px;
        row-gap: 8px;
      }

      #metadata * {
        white-space: nowrap;
      }

      #metadata > span {
        padding: 6px 10px;
        border-radius: 10px;
        height: fit-content;
        min-height: 20px;
        display: flex;
        align-items: center;
      }

      #metadata > span:has(.categories) {
        padding-right: 5px;
      }

      .categories > li {
        background-color: rgb(from var(--color-primary) r g b / 75%);
        padding: 2px 6px;
        border-radius: 4px;
        color: var(--color-white);
      }

      .title:has(+ #metadata) {
        margin-bottom: 0px;
      }

      h1.name {
        font-size: 48px;
      }

      .posts-list {
        margin-bottom: 32px;
      }

      .posts-list li {
        margin-bottom: 8px;
        line-height: 28px;
      }

      p:has(+ ul) {
        margin-bottom: 0px;
      }

      .article-link::after {
        content: " ↗";
        font-size: 14px;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <header>
      <span><a class="header" href="/">tphbrok.me</a></span>
    </header>

    <main><h1>Posts</h1><h2 class="posts-year">2026</h2><ul class="posts-list"><li><a href="audiodevlog-2.html">audiodevlog 002: Project refinements</a> (2026-07-30)</li><li><a href="change-of-scenery-change-of-mind.html">Change of scenery, change of mind</a> (2026-07-29)</li><li><a href="audiodevlog-1.html">audiodevlog 001: Introduction</a> (2026-07-27)</li><li><a href="choose-your-forever-game.html">Choose your forever game</a> (2026-07-21)</li></ul></main>
  </body>
</html>
